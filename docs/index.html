<style>

  --c-kw:#b5610a;--c-str:#15803d;--c-num:#b03a00;--c-cm:#8a8a96;--link:#1d4ed8;--run-fg:#fff;--acc-fg:#fff;--sb-bg:#b5610a;--sb-fg:#fff}
*{box-sizing:border-box}

button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100dvh;max-width:1600px;margin-inline:auto;background:var(--bg)}
.tb{display:flex;align-items:center;gap:14px;padding:7px max(14px,env(safe-area-inset-right)) 7px max(14px,env(safe-area-inset-left));padding-top:max(7px,env(safe-area-inset-top));background:var(--act);border-bottom:1px solid var(--line)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}

.pg-trout{white-space:pre}
.pg-out .ln{display:block}.pg-out .ln::before{content:"› ";color:var(--acc2)}.pg-out .err,.pg-trout.err{display:block;color:var(--err)}.muted{color:var(--mu)}

.doc p,.doc li{font-size:15px;line-height:1.65}.doc blockquote{margin:12px 0;padding:6px 14px;border-left:3px solid var(--acc);color:var(--mu);font-style:italic}

.doc a{color:var(--link)}
.btn{all:unset;cursor:pointer;display:inline-block;margin:6px 10px 0 0;background:var(--acc);color:var(--acc-fg);font:600 13px var(--sans);padding:6px 16px;border-radius:5px}.btn.g{background:none;border:1px solid var(--line);color:var(--fg)}.btn:hover{filter:brightness(1.12)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th{text-align:left;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:0;border-bottom:1px solid var(--line)}td button{all:unset;cursor:pointer;display:block;width:100%;padding:8px 10px}tr:hover td{background:var(--hov)}tr:has(.on) td{background:var(--sel)}td.b button{font:500 12.5px var(--mono);color:var(--acc)}td.t button{font:500 12px var(--mono);color:var(--link)}
.kwd{margin-top:14px;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.kwd-tok{font:600 11px var(--mono);background:var(--acc);color:var(--acc-fg);padding:2px 7px;border-radius:4px;margin-right:8px}.kwd-b{font:600 15px var(--mono)}.kwd-p{margin:0;color:var(--mu)}
.kwd-ex{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:500 12.5px/1.5 var(--mono);overflow:auto}.kwd-test{justify-self:start}
.fl{list-style:none;padding:0;margin:0;display:grid;gap:8px}.fl button{all:unset;cursor:pointer;display:block;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font:italic 500 16px var(--sans)}.fl button:hover{border-color:var(--acc)}
.fl small{display:none;font:500 12px var(--mono);font-style:normal;color:var(--acc2);margin-top:4px}.fl .open small{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.cards button{all:unset;cursor:pointer;display:block;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--side)}
.cards button:hover,.cards .on{border-color:var(--acc)}.cards b{display:block;font-size:16px}.cards p{margin:6px 0 0;font-size:13px;color:var(--mu)}.cards .dm{display:none;margin-top:8px;font:500 12px var(--mono);color:var(--acc2)}.cards .on .dm{display:block}
pre.sh2{background:var(--side);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:500 13px/1.6 var(--mono);overflow:auto}
.sb{display:flex;align-items:center;gap:16px;background:var(--sb-bg);color:var(--sb-fg);padding:2px max(12px,env(safe-area-inset-right)) max(2px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));font:500 12px var(--sans);flex-wrap:wrap}
.sb button{all:unset;cursor:pointer;padding:0 6px;border-radius:3px}.sb button:hover{background:rgba(0,0,0,.18)}.sb .sp{flex:1}
@media(max-width:820px){.mid{grid-template-columns:44px 1fr;position:relative}.act button{width:44px}.side{position:absolute;left:44px;top:0;bottom:0;z-index:5;box-shadow:12px 0 30px rgba(0,0,0,.4)}kbd,.dots{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app" id="app">
  <div class="tb"><div class="dots"><i></i><i></i><i></i></div><div class="ttl" id="ttl"></div><kbd>Ctrl ↵</kbd><button class="runtop" id="run-top" disabled>Carregando…</button></div>
  <div class="mid">
    <div class="act">
      <button data-act="exp" class="on" title="Explorador" aria-label="Explorador">▤</button>
      <button data-act="kw" title="Palavras-chave" aria-label="Palavras-chave">{ }</button>
      <button data-act="pipe" title="Como é feita" aria-label="Como é feita">⇉</button>
      <span class="sp"></span>
      <button id="theme" title="Alternar tema" aria-label="Alternar tema">◐</button>
    </div>
    <div class="side" id="side"></div>
    <div class="main">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="crumb" id="crumb"></div>
      <div class="view" id="code">
        <div class="pg" data-tab="out" data-lang="python" id="pg">
          <div class="pg-ed"><div class="pg-gut" id="gut" aria-hidden="true"></div><div class="pg-box"><pre class="pg-hl" id="hl" aria-hidden="true"></pre><textarea class="pg-ta" id="ta" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Código CACHOEIRA"></textarea></div></div>
          <div class="pg-acts"><button class="pg-run" id="run" disabled>Carregando…</button><span class="pg-status" id="status" aria-live="polite"></span></div>
          <div class="pg-tabs" role="tablist"><button role="tab" data-tab="out">Saída</button><button role="tab" data-tab="tok">Tokens</button><button role="tab" data-tab="tr">Tradução</button></div>
          <div class="pg-langs"><button data-lang="python">Python</button><button data-lang="javascript">JavaScript</button><button data-lang="lua">Lua</button><button data-lang="ruby">Ruby</button><button id="copy">Copiar</button></div>
          <div class="pg-pane" data-pane="out"><div class="pg-out" id="out" aria-live="polite"></div></div>
          <div class="pg-pane" data-pane="tok"><div class="pg-toks" id="toks"></div></div>
          <div class="pg-pane" data-pane="tr"><pre class="pg-trout" id="trout"></pre></div>
        </div>
      </div>
      <div class="view doc" id="doc" hidden></div>
    </div>
  </div>
  <div class="sb"><span>⎇ main</span><span id="pos">Ln 1, Col 1</span><span class="sp"></span><span id="st">carregando interpretador…</span><span>CACHOEIRA</span><span>UTF-8</span><button id="sbt">Barra lateral</button></div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const GITHUB = 'https://github.com/Vinilazza/Compiladores';
  const initialHash = decodeURIComponent((location.hash || '').slice(1));

  /* ---------- dados ---------- */
  const KW = [
    ['MEMO', 'MEMO', 'VAR', 'declara uma variável', 'MEMO nome = "cachoeira"\nMEMO idade = 20\nÉ LOKO, CACHOEIRA! nome + " tem " + idade'],
    ['É LOKO, CACHOEIRA!', 'É LOKO!', 'PRINT', 'imprime um valor', 'É LOKO, CACHOEIRA! "é loko, cachoeira!"\nÉ LOKO, CACHOEIRA! 2 + 2 * 10'],
    ['SE É LOUCO CACHOEIRA (...)', 'SE É LOUCO', 'IF', 'estrutura condicional', 'MEMO idade = 20\nSE É LOUCO CACHOEIRA (idade >= 18)\n    É LOKO, CACHOEIRA! "maior de idade"\nMEMO, CACHOEIRA, MEMO'],
    ['SÓ TRABALHADOR SÓ ZÉ POVINHO', 'SÓ ZÉ POVINHO', 'ELSE', 'ramo alternativo do if', 'MEMO idade = 15\nSE É LOUCO CACHOEIRA (idade >= 18)\n    É LOKO, CACHOEIRA! "pode entrar"\nSÓ TRABALHADOR SÓ ZÉ POVINHO\n    É LOKO, CACHOEIRA! "só trabalhador, só zé povinho"\nMEMO, CACHOEIRA, MEMO'],
    ['SÓ POR DEUS IRMÃO (...)', 'SÓ POR DEUS', 'WHILE', 'laço de repetição', 'MEMO i = 1\nSÓ POR DEUS IRMÃO (i <= 5)\n    É LOKO, CACHOEIRA! "volta " + i\n    i = i + 1\nMEMO, CACHOEIRA, MEMO'],
    ['SÓ POR DEUS IRMÃO TENTANDO', 'TENTANDO', 'TRY', 'início de bloco protegido', 'SÓ POR DEUS IRMÃO TENTANDO\n    É LOKO, CACHOEIRA! 10 / 0\nEU NÃO ASSUMO ESSE B.O\n    É LOKO, CACHOEIRA! "deu ruim"\nMEMO, CACHOEIRA, MEMO'],
    ['EU NÃO ASSUMO ESSE B.O', 'NÃO ASSUMO', 'CATCH', 'captura erro em tempo de execução', 'SÓ POR DEUS IRMÃO TENTANDO\n    É LOKO, CACHOEIRA! nao_existe\nEU NÃO ASSUMO ESSE B.O\n    É LOKO, CACHOEIRA! "eu não assumo esse B.O"\nMEMO, CACHOEIRA, MEMO'],
    ['SOU DE SÃO PAULO FI, NÓIS ROUBA DE PISTOLA', 'SOU DE SP', 'FUNC', 'define uma função', 'SOU DE SÃO PAULO FI, NÓIS ROUBA DE PISTOLA dobro(n)\n    NÃO SOU NEM ENVOLVIDO NO CRIME n * 2\nMEMO, CACHOEIRA, MEMO\n\nÉ LOKO, CACHOEIRA! dobro(21)'],
    ['NÃO SOU NEM ENVOLVIDO NO CRIME', 'NÃO SOU ENVOLVIDO', 'RETURN', 'retorna um valor da função', 'SOU DE SÃO PAULO FI, NÓIS ROUBA DE PISTOLA soma(a, b)\n    NÃO SOU NEM ENVOLVIDO NO CRIME a + b\nMEMO, CACHOEIRA, MEMO\n\nÉ LOKO, CACHOEIRA! soma(40, 2)'],
    ['MEMO, CACHOEIRA, MEMO', 'MEMO, CACHOEIRA', 'END', 'fecha qualquer bloco (if/while/try/função)', 'MEMO x = 3\nSE É LOUCO CACHOEIRA (x > 1)\n    É LOKO, CACHOEIRA! "x é grande"\nMEMO, CACHOEIRA, MEMO\nÉ LOKO, CACHOEIRA! "bloco fechado"'],
    ['FI', 'FI', 'TRUE', 'literal booleano verdadeiro', 'MEMO ok = FI\nÉ LOKO, CACHOEIRA! ok\nÉ LOKO, CACHOEIRA! !ok'],
    ['NUNCA NA VIDA', 'NUNCA NA VIDA', 'FALSE', 'literal booleano falso', 'MEMO crime = NUNCA NA VIDA\nSE É LOUCO CACHOEIRA (crime)\n    É LOKO, CACHOEIRA! "não rola"\nSÓ TRABALHADOR SÓ ZÉ POVINHO\n    É LOKO, CACHOEIRA! "tudo certo"\nMEMO, CACHOEIRA, MEMO'],
  ].map(([b, short, t, d, ex]) => ({ b, short, t, d, ex }));
  const FALAS = [
    ['é loko, cachoeira! memo, cachoeira, memo', [1, 9]], ['só por deus irmão, só por deus', [4, 5]], ['se é louco cachoeira', [2]],
    ['eu não assumo esse B.O', [6]], ['sou de São Paulo fi, nóis rouba de pistola', [7]],
    ['não sou nem envolvido no crime, nóis rouba de pistola', [8]], ['só trabalhador, só zé povinho', [3]],
  ];
  const PIPE = [
    ['Lexer', 'lexer.py', 'Casa os bordões (do mais longo pro mais curto) e gera os tokens da linguagem.', 'MEMO x = 1  →  VAR · IDENT(x) · EQ · NUMBER(1)'],
    ['Parser', 'parser.py', 'Recursivo-descendente, monta a AST respeitando a gramática (EBNF) e a precedência de operadores.', 'Var(x, Lit 1)'],
    ['Interpretador', 'interpreter.py', 'Percorre a AST (tree-walking), com escopos aninhados, closures e recursão de verdade.', 'x ← 1'],
    ['Erros', 'errors.py', 'Erros de sintaxe e de execução em português, capturáveis no próprio código com EU NÃO ASSUMO ESSE B.O.', 'Linha 3: divisão por zero — nem por deus irmão isso vai colar'],
  ];

  /* ---------- realce de sintaxe ---------- */
  const KWRE = [/MEMO\s*,?\s*CACHOEIRA\s*,?\s*MEMO/iy, /[EÉ]\s*LOKO\s*,?\s*CACHOEIRA\s*!?/iy, /SOU\s+DE\s+S[AÃ]O\s+PAULO\s+FI\s*,?\s+N[OÓ]IS\s+ROUBA\s+DE\s+PISTOLA/iy,
    /N[AÃ]O\s+SOU\s+NEM\s+ENVOLVIDO\s+NO\s+CRIME/iy, /SE\s+[EÉ]\s+LOUCO\s+CACHOEIRA/iy, /S[OÓ]\s+TRABALHADOR\s+S[OÓ]\s+Z[EÉ]\s+POVINHO/iy,
    /S[OÓ]\s+POR\s+DEUS\s+IRM[AÃ]O/iy, /TENTANDO\b/iy, /EU\s+N[AÃ]O\s+ASSUMO\s+ESSE\s+B\.?\s*O\.?/iy, /NUNCA\s+NA\s+VIDA\b/iy, /FI\b/iy, /MEMO\b/iy];
  const R = { cm: /#[^\n]*/y, str: /"([^"\\]|\\.)*"/y, num: /\d+(\.\d+)?/y, id: /[A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ0-9_]*/y };
  const at = (re, s, p) => { re.lastIndex = p; return re.exec(s); };
  function highlight(src) {
    let out = '', p = 0;
    outer: while (p < src.length) {
      let m;
      if ((m = at(R.cm, src, p))) { out += `<i class="t-cm">${esc(m[0])}</i>`; p += m[0].length; continue; }
      for (const re of KWRE) if ((m = at(re, src, p))) { out += `<b class="t-kw">${esc(m[0])}</b>`; p += m[0].length; continue outer; }
      if ((m = at(R.str, src, p))) { out += `<span class="t-str">${esc(m[0])}</span>`; p += m[0].length; continue; }
      if ((m = at(R.num, src, p))) { out += `<span class="t-num">${m[0]}</span>`; p += m[0].length; continue; }
      if ((m = at(R.id, src, p))) { out += esc(m[0]); p += m[0].length; continue; }
      out += esc(src[p]); p++;
    }
    return out + '\n';
  }

  /* ---------- estado ---------- */
  const ta = $('ta'), pg = $('pg');
  let py = null, runPy = null, tokPy = null, trPy = null;
  const files = [
    { n: 'LEIA-ME.md', k: 'md', dir: 'docs' }, { n: 'palavras-chave.md', k: 'md', dir: 'docs' },
    { n: 'falas.md', k: 'md', dir: 'docs' }, { n: 'pipeline.md', k: 'md', dir: 'docs' },
  ];
  const code = {};
  let open = ['LEIA-ME.md'], cur = 'LEIA-ME.md', side = 'exp', shown = null;
  const byName = (n) => files.find((f) => f.n === n);

  const docs = {
    'LEIA-ME.md': () => `<div><h1>CACHOEIRA<span>.</span></h1><blockquote>"é loko, cachoeira! memo, cachoeira, memo"</blockquote>
<p>Linguagem de programação esotérica criada para a matéria de <b>Compiladores</b>. Cada palavra-chave vem de uma fala do vídeo viral do "Cachoeira" (o caso de assalto em mercado que virou meme), na mesma pegada da <a href="https://birl-language.github.io/" target="_blank" rel="noopener">BIRL</a>.</p>
<h2>O que ela faz</h2><ul><li>Variáveis com tipos dinâmicos</li><li>Condicionais, laços e funções com recursão</li><li>Tratamento de erro com <code>EU NÃO ASSUMO ESSE B.O</code></li><li>Tradução para Python, JavaScript, Lua e Ruby</li></ul>
<p>Lexer, parser recursivo-descendente e interpretador escritos do zero em Python. O playground abaixo roda o interpretador de verdade no seu navegador, via Pyodide.</p>
<h2>Começar</h2><p><button class="btn" data-o="fibonacci.cch">Abrir fibonacci.cch</button><button class="btn g" data-o="palavras-chave.md">Ver palavras-chave</button><a class="btn g" style="text-decoration:none" href="${GITHUB}" target="_blank" rel="noopener">Repositório ↗</a></p></div>`,
    'palavras-chave.md': () => `<div><h1>Palavras-chave</h1><p>Selecione uma linha para ver a descrição e testar o exemplo no editor.</p><div id="kwx"><table><thead><tr><th>Bordão</th><th>Token</th><th>Significado</th></tr></thead><tbody>${KW.map((k, i) => `<tr><td class="b"><button data-kw="${i}">${esc(k.b)}</button></td><td class="t"><button data-kw="${i}" tabindex="-1">${k.t}</button></td><td><button data-kw="${i}" tabindex="-1">${esc(k.d)}</button></td></tr>`).join('')}</tbody></table><div class="kwd" id="kwd" hidden></div></div>
<p style="margin-top:14px;color:var(--mu)">Extras convencionais: números, strings entre <code>"..."</code>, identificadores, operadores <code>+ - * /</code>, comparações, <code>&amp;&amp; || !</code>, vírgula, parênteses e comentários com <code>#</code>.</p></div>`,
    'falas.md': () => `<div><h1>As falas originais</h1><p>Cada palavra-chave da linguagem sai de uma dessas frases. Clique para ver o mapeamento.</p><ul class="fl">${FALAS.map(([q, ks]) => `<li><button>“${esc(q)}”<small>→ ${ks.map((k) => KW[k].t + ' · ' + KW[k].short).join('  ·  ')}</small></button></li>`).join('')}</ul></div>`,
    'pipeline.md': () => `<div><h1>Como é feita por dentro</h1><p>O pipeline clássico de um interpretador.</p><div class="cards">${PIPE.map((p) => `<button><b>${p[0]}</b><code>${p[1]}</code><p>${esc(p[2])}</p><span class="dm">${esc(p[3])}</span></button>`).join('')}</div><h2>Como rodar no terminal</h2><pre class="sh2">git clone ${GITHUB}.git\ncd Compiladores\npython3 main.py examples/fibonacci.cch</pre></div>`,
  };

  /* ---------- editor ---------- */
  function paint() {
    $('hl').innerHTML = highlight(ta.value);
    let g = ''; for (let i = 1, n = ta.value.split('\n').length; i <= n; i++) g += i + '\n';
    $('gut').textContent = g; sync();
  }
  function sync() { $('hl').scrollTop = $('gut').scrollTop = ta.scrollTop; $('hl').scrollLeft = ta.scrollLeft; }
  ta.addEventListener('scroll', sync);
  ta.addEventListener('input', () => { paint(); if (byName(cur)?.k === 'cch') code[cur] = ta.value; refreshTab(); });
  const pos = () => { const v = ta.value.slice(0, ta.selectionStart).split('\n'); $('pos').textContent = `Ln ${v.length}, Col ${v.at(-1).length + 1}`; };
  ['keyup', 'click', 'input'].forEach((e) => ta.addEventListener(e, pos));
  const say = (m) => { $('st').textContent = m; };

  function setCode(src) { ta.value = src; ta.scrollTop = 0; paint(); }
  function run() {
    if (!runPy) return;
    const [out, err] = runPy(ta.value).toJs();
    $('out').innerHTML = (out ? out.split('\n').map((l) => `<span class="ln">${esc(l)}</span>`).join('') : '') + (err ? `<span class="err">${esc(err)}</span>` : '') + (!out && !err ? '<span class="ln muted">rodou sem imprimir nada</span>' : '');
    pg.classList.toggle('has-err', !!err);
    $('status').textContent = err ? '✗ erro' : `✓ ${out ? out.split('\n').length : 0} linha(s) na saída`;
    say(err ? '✗ erro na execução' : '✓ executado sem erros');
  }
  function tokens() {
    if (!tokPy) return;
    const [json, err] = tokPy(ta.value).toJs();
    if (err) { $('toks').innerHTML = `<span class="err">${esc(err)}</span>`; return; }
    const lines = new Map(); JSON.parse(json).forEach((t) => { if (!lines.has(t[2])) lines.set(t[2], []); lines.get(t[2]).push(t); });
    const sym = new Set(['PLUS', 'MINUS', 'STAR', 'SLASH', 'EQ', 'LT', 'GT', 'LE', 'GE', 'AND', 'OR', 'NEQ', 'EQEQ', 'BANG', 'LPAREN', 'RPAREN', 'COMMA', 'IDENT']);
    $('toks').innerHTML = [...lines].map(([ln, ts]) => `<div class="pg-tkl"><em>${ln}</em>${ts.map(([ty, v]) => {
      const c = ty === 'STRING' ? 's' : ty === 'NUMBER' ? 'n' : sym.has(ty) ? '' : 'k';
      const extra = ['IDENT', 'STRING', 'NUMBER'].includes(ty) ? `<small>${esc(v).slice(0, 22)}</small>` : '';
      return `<span class="tk ${c}">${ty === 'WHILE_OR_TRY' ? 'WHILE/TRY' : ty}${extra}</span>`;
    }).join('')}</div>`).join('') || '<span class="muted">nenhum token ainda</span>';
  }
  function translate() {
    if (!trPy) return;
    const [res, err] = trPy(ta.value, pg.dataset.lang).toJs();
    $('trout').textContent = err || res; $('trout').classList.toggle('err', !!err);
    pg.querySelectorAll('.pg-langs [data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === pg.dataset.lang));
  }
  function tab(t) {
    pg.dataset.tab = t; pg.querySelectorAll('.pg-tabs [data-tab]').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === t));
    if (t === 'tok') tokens(); if (t === 'tr') translate();
  }
  ta.addEventListener('input', () => { if (pg.dataset.tab === 'tok') tokens(); if (pg.dataset.tab === 'tr') translate(); });
  function doRun() { if (byName(cur).k !== 'cch') show(files.find((f) => f.k === 'cch')?.n || cur); tab('out'); run(); }

  /* ---------- explorador, abas, documentos ---------- */
  function paintSide() {
    const s = $('side');
    if (side === 'exp') s.innerHTML = `<div class="sh">Explorador</div><div class="grp">CACHOEIRA</div><div class="grp" style="padding-left:22px">docs</div>${files.filter((f) => f.dir === 'docs').map((f) => `<button class="file${f.n === cur ? ' on' : ''}" data-o="${f.n}"><i class="m">MD</i>${f.n}</button>`).join('')}<div class="grp" style="padding-left:22px">examples</div>${files.filter((f) => f.dir === 'examples').map((f) => `<button class="file${f.n === cur ? ' on' : ''}" data-o="${f.n}"><i class="c">CCH</i>${f.n}</button>`).join('')}`;
    else if (side === 'kw') s.innerHTML = `<div class="sh">Palavras-chave</div><p class="note">Clique para inserir o trecho no editor.</p><div class="sl">${KW.map((k, i) => `<button data-ins="${i}"><em>${k.t}</em><b>${esc(k.short)}</b><small>${esc(k.d)}</small></button>`).join('')}</div>`;
    else s.innerHTML = `<div class="sh">Como é feita</div><div class="sl">${PIPE.map((p) => `<button data-o="pipeline.md"><em>${p[1].split('.')[0].slice(0, 5)}</em><b>${p[0]}</b><small>${esc(p[2].slice(0, 56))}…</small></button>`).join('')}</div>`;
  }
  function paintTabs() {
    $('tabs').innerHTML = open.map((n) => { const f = byName(n); return `<div class="tab${n === cur ? ' on' : ''}" role="tab" tabindex="0" data-o="${n}"><i class="${f.k === 'md' ? 'm' : 'c'}">${f.k === 'md' ? 'MD' : 'CCH'}</i>${n}<span class="x" data-x="${n}" role="button" aria-label="Fechar ${n}">✕</span></div>`; }).join('');
    const f = byName(cur); $('crumb').textContent = `CACHOEIRA › ${f.dir} › ${f.n}`; $('ttl').innerHTML = `<b>${f.n}</b> — CACHOEIRA Studio`;
  }
  const refreshTab = () => {};
  function show(n) {
    if (byName(cur)?.k === 'cch') code[cur] = ta.value;
    cur = n; const f = byName(n);
    if (f.k === 'cch') { $('code').hidden = false; $('doc').hidden = true; if (shown !== n) { setCode(code[n]); shown = n; run(); } }
    else { $('code').hidden = true; $('doc').hidden = false; $('doc').innerHTML = docs[n](); shown = null; }
    paintTabs(); paintSide();
    try { history.replaceState(null, '', '#' + n.replace(/\.[^.]+$/, '')); } catch (e) { }
  }
  function openF(n) { if (!open.includes(n)) open.push(n); show(n); if (matchMedia('(max-width:820px)').matches) $('app').classList.add('sb-off'); }
  function closeF(n) { const i = open.indexOf(n); open.splice(i, 1); if (!open.length) open = ['LEIA-ME.md']; if (cur === n) show(open[Math.max(0, i - 1)]); else paintTabs(); }
  function kwDetail(i) {
    const k = KW[i], d = $('kwd');
    d.innerHTML = `<div><span class="kwd-tok">${k.t}</span><b class="kwd-b">${esc(k.b)}</b></div><p class="kwd-p">${esc(k.d)}</p><pre class="kwd-ex">${highlight(k.ex)}</pre><button class="kwd-test" data-test="${i}">Testar no editor ▶</button>`;
    d.hidden = false;
    document.querySelectorAll('#kwx [data-kw]').forEach((b) => b.classList.toggle('on', +b.dataset.kw === i));
  }
  function loadExample(src, n) {
    const f = files.find((x) => x.k === 'cch'); const name = byName(cur)?.k === 'cch' ? cur : (n || f?.n);
    if (!name) { setCode(src); return; }
    if (byName(cur).k !== 'cch') { if (!open.includes(name)) open.push(name); cur = name; shown = name; $('code').hidden = false; $('doc').hidden = true; paintTabs(); paintSide(); }
    setCode(src); code[cur] = src; tab('out'); run();
  }

  document.addEventListener('click', (e) => {
    const t = e.target;
    const x = t.closest('[data-x]'); if (x) { e.stopPropagation(); closeF(x.dataset.x); return; }
    const o = t.closest('[data-o]'); if (o) { openF(o.dataset.o); return; }
    const a = t.closest('[data-act]');
    if (a) { const same = side === a.dataset.act && !$('app').classList.contains('sb-off'); side = a.dataset.act; $('app').classList.toggle('sb-off', same); document.querySelectorAll('.act [data-act]').forEach((b) => b.classList.toggle('on', b === a)); paintSide(); return; }
    const ins = t.closest('[data-ins]'); if (ins) { const k = KW[+ins.dataset.ins]; if (byName(cur).k !== 'cch') { const f = files.find((q) => q.k === 'cch'); if (f) openF(f.n); } ta.value = ta.value.replace(/\s*$/, '\n\n') + k.ex + '\n'; paint(); code[cur] = ta.value; ta.focus(); ta.scrollTop = ta.scrollHeight; say('inserido: ' + k.t); return; }
    const kw = t.closest('[data-kw]'); if (kw) { kwDetail(+kw.dataset.kw); return; }
    const te = t.closest('[data-test]'); if (te) { loadExample(KW[+te.dataset.test].ex); return; }
    if (t.closest('#run') || t.closest('#run-top')) { doRun(); return; }
    const tb = t.closest('.pg-tabs [data-tab]'); if (tb) { tab(tb.dataset.tab); return; }
    const lb = t.closest('.pg-langs [data-lang]'); if (lb) { pg.dataset.lang = lb.dataset.lang; translate(); return; }
    if (t.closest('#copy')) { const b = $('copy'); (navigator.clipboard ? navigator.clipboard.writeText($('trout').textContent) : Promise.reject()).then(() => { b.textContent = 'Copiado!'; }, () => { b.textContent = 'Use Ctrl+C'; const r = document.createRange(); r.selectNodeContents($('trout')); getSelection().removeAllRanges(); getSelection().addRange(r); }).finally(() => setTimeout(() => (b.textContent = 'Copiar'), 1500)); return; }
    if (t.closest('#theme')) { document.documentElement.classList.toggle('lt'); try { localStorage.setItem('cch-theme', document.documentElement.classList.contains('lt') ? 'lt' : 'dk'); } catch (e) { } return; }
    if (t.closest('#sbt')) { $('app').classList.toggle('sb-off'); return; }
    const f = t.closest('.fl button'); if (f) { f.classList.toggle('open'); return; }
    const c = t.closest('.cards button'); if (c) c.classList.toggle('on');
  });
  document.addEventListener('keydown', (e) => {
    const t = e.target.closest?.('.tab'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openF(t.dataset.o); }
    if (e.target === ta && (e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doRun(); }
  });

  /* ---------- inicialização ---------- */
  try { if (localStorage.getItem('cch-theme') === 'lt') document.documentElement.classList.add('lt'); } catch (e) { }
  if (matchMedia('(max-width:820px)').matches) $('app').classList.add('sb-off');
  show('LEIA-ME.md'); tab('out');

  (async () => {
    try {
      const names = await (await fetch('examples/index.json')).json();
      await Promise.all(names.map(async (n) => { code[n] = await (await fetch('examples/' + n)).text(); }));
      names.forEach((n) => files.push({ n, k: 'cch', dir: 'examples' }));
      paintSide();
      const hit = files.find((f) => f.n.replace(/\.[^.]+$/, '') === initialHash);
      openF(hit ? hit.n : names.includes('fibonacci.cch') ? 'fibonacci.cch' : names[0]);
      if (matchMedia('(max-width:820px)').matches) $('app').classList.add('sb-off');
    } catch (e) { say('não consegui carregar os exemplos'); }
    try {
      py = await loadPyodide();
      py.FS.mkdir('/home/pyodide/cachoeira');
      for (const f of ['__init__', 'errors', 'ast_nodes', 'lexer', 'parser', 'interpreter', 'codegen'])
        py.FS.writeFile(`/home/pyodide/cachoeira/${f}.py`, await (await fetch(`cachoeira/${f}.py`)).text());
      py.runPython(`
import sys, json
sys.path.insert(0, "/home/pyodide")
from cachoeira import run_source, traduzir, CachoeiraSyntaxError, CachoeiraRuntimeError
from cachoeira.lexer import tokenize
def executar(src):
    saida = []
    erro = None
    try:
        run_source(src, out=saida.append)
    except CachoeiraSyntaxError as e:
        erro = f"[erro de sintaxe] {e}"
    except CachoeiraRuntimeError as e:
        erro = f"[erro em tempo de execução] {e}"
    return "\\n".join(saida), erro
def tokens_web(src):
    try:
        return json.dumps([[t.type, str(t.value), t.line] for t in tokenize(src) if t.type != "EOF"]), None
    except CachoeiraSyntaxError as e:
        return "", f"[erro de sintaxe] {e}"
def traduzir_web(src, alvo):
    try:
        return traduzir(src, alvo), None
    except (CachoeiraSyntaxError, CachoeiraRuntimeError) as e:
        return "", f"[erro] {e}"
`);
      runPy = py.globals.get('executar'); tokPy = py.globals.get('tokens_web'); trPy = py.globals.get('traduzir_web');
      $('run').textContent = '▶ Executar'; $('run-top').textContent = '▶ Executar'; $('run').disabled = $('run-top').disabled = false;
      say('✓ interpretador pronto');
      if (byName(cur)?.k === 'cch') run();
    } catch (e) {
      $('run').textContent = 'Falhou ao carregar'; $('run-top').textContent = 'Falhou ao carregar'; say('✗ falha ao carregar o Pyodide');
      $('out').innerHTML = `<span class="err">${esc(String(e))}</span>`;
    }
  })();
})();
</script>
</body>
